<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Hotel Room Booking Form</h1>
    <form action="post">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <br><br>
        <label for="checkin">Check-in Date</label>
        <br>
        <input type="date" id="checkin" name="checkin">
        <br><br>
        <label for="checkout">Check-out Date</label>
        <input type="date" id="checkin" name="checkout">
        <br><br>
        <label for="room type">Room Type</label>
        <select id="room" name="room">
            <option>Single Room </option>
            <option>Double Room</option>
            <option>Deluxe</option>
            <option>Suite</option>
        </select>
                <br><br>
        <label for="number of guests">Number Of Guests</label>
        <input type="number" id="guests" name="guests" min="1" max="10">
        <br><br>
        <label for="comment">Special Request</label><br>
        <textarea name="comment" rows="4" cols="50">
        enter your comment here...
    </textarea>

    </form>
</body>
</html>
